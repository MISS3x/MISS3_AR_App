<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testik - Home</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: radial-gradient(circle at center, #f3f4f6, #9ca3af); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card { background: white; padding: 40px; border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; width: 340px; max-width: 90%; }
        .title { font-size: 24px; font-weight: 800; color: #111827; margin-bottom: 30px; }
        .btn { width: 100%; padding: 16px; font-size: 18px; border-radius: 16px; font-weight: 700; margin-bottom: 16px; cursor: pointer; border: none; transition: transform 0.1s; display: block; text-decoration: none; box-sizing: border-box; }
        .btn:active { transform: scale(0.98); }
        .btn-ar { background: #2563eb; color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .btn-3d { background: #4b5563; color: white; box-shadow: 0 4px 12px rgba(75, 85, 99, 0.3); }
        .footer { font-size: 10px; color: #4b5563; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">Choose Experience</div>
        <a href="ar_room.html" class="btn btn-ar">📸 Enter AR Room</a>
        <a href="3d_room.html" class="btn btn-3d">📦 Enter 3D Room</a>
        <div class="footer">Powered by MISS3</div>
    </div>
</body>
</html>
